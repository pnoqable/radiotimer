<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>radiotimer</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 1300px; }
    h1 { margin-bottom: .25rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #8884; vertical-align: top; }
    form { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; margin-top: 1rem; }
    form label { display: flex; flex-direction: column; font-size: .8rem; }
    input, select { padding: .35rem; }
    input.invalid { border: 1px solid #c33; background: #fff0f0; }
    .days { grid-column: 1 / -1; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; border: 1px solid #8884; border-radius: 6px; padding: .5rem .75rem; margin: 0; }
    .days legend { font-size: .8rem; padding: 0 .25rem; }
    .days label { flex-direction: row; font-size: .8rem; gap: .25rem; }
    button { padding: .4rem .8rem; cursor: pointer; }
    .running { color: #2a2; font-weight: bold; }
    .card { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 0; }
    .col-left > .card:not(:first-child) { margin-top: 1rem; }
    .layout { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1rem; }
    @media (min-width: 1200px) {
      .layout { grid-template-columns: 1.6fr 1fr; align-items: start; }
    }
    @media (max-width: 800px) {
      form { grid-template-columns: 1fr; }
    }
    details { margin-left: 1rem; }
    summary { cursor: pointer; font-weight: 600; }
    .file-row { display: flex; gap: .5rem; align-items: center; padding: .15rem 0 0 1.5rem; }
    .del-link { color: #c33; text-decoration: none; cursor: pointer; }
    .url-link { color: inherit; text-decoration: underline; cursor: pointer; }
    .del-link:hover { text-decoration: underline; }
    .muted { color: #888; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="col-left">
      <div class="card">
        <h1>Sender</h1>
        <form id="station-form">
          <input type="hidden" id="station-id" />
          <label>Name<input id="station-name" required /></label>
          <label>Stream/Playlist-URL<input id="station-url" required placeholder="https://.../stream.m3u" /></label>
          <button type="submit" id="station-submit">Sender speichern</button>
          <button type="button" id="station-reset">Abbrechen</button>
        </form>
        <table id="stations">
          <thead><tr><th>Name</th><th>URL</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <h1>Sendung</h2>
        <form id="schedule-form">
          <input type="hidden" id="id" />
          <label>Titel<input id="title" required /></label>
          <label>Sender<select id="station_id" required></select></label>
          <label>Start (HH:MM)<input id="start_time" required placeholder="20:00" /></label>
          <label>Ende (HH:MM)<input id="end_time" required placeholder="21:00" /></label>
          <fieldset class="days">
            <legend>Wochentage</legend>
            <label><input type="checkbox" class="day" value="mon" />Montag</label>
            <label><input type="checkbox" class="day" value="tue" />Dienstag</label>
            <label><input type="checkbox" class="day" value="wed" />Mittwoch</label>
            <label><input type="checkbox" class="day" value="thu" />Donnerstag</label>
            <label><input type="checkbox" class="day" value="fri" />Freitag</label>
            <label><input type="checkbox" class="day" value="sat" />Samstag</label>
            <label><input type="checkbox" class="day" value="sun" />Sonntag</label>
          </fieldset>
          <label style="flex-direction: row; align-items: center; gap: .4rem;"><input type="checkbox" id="enabled" checked />Aktiv</label>
          <button type="submit" id="submit-btn">Speichern</button>
          <button type="button" id="reset-btn">Abbrechen</button>
        </form>
      <table id="schedules">
        <thead><tr><th>Titel</th><th>Sender</th><th>Zeit</th><th>Wochentage</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </div>

    <div class="col-right">
      <h2>Aufnahmen</h2>
      <div id="recordings"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // Normalize a free-form time entry to "HH:MM". Accepts "16", "16:00",
    // "1600", "8:5", etc. Returns null for anything that is not a valid time.
    function normalizeTime(raw) {
      if (raw == null) return null;
      const s = String(raw).trim().replace(/\s+/g, "");
      if (s === "") return null;
      let h, m = 0;
      if (s.includes(":")) {
        const parts = s.split(":");
        if (parts.length !== 2) return null;
        h = parts[0];
        m = parts[1];
      } else if (/^\d{3,4}$/.test(s)) {
        h = s.slice(0, s.length - 2);
        m = s.slice(s.length - 2);
      } else if (/^\d{1,2}$/.test(s)) {
        h = s;
      } else {
        return null;
      }
      if (!/^\d{1,2}$/.test(h) || !/^\d{1,2}$/.test(m)) return null;
      h = parseInt(h, 10);
      m = parseInt(m, 10);
      if (h < 0 || h > 23 || m < 0 || m > 59) return null;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }

    function attachTimeField(id) {
      const el = $(id);
      el.addEventListener("blur", () => {
        if (el.value.trim() === "") {
          el.classList.remove("invalid");
          return;
        }
        const norm = normalizeTime(el.value);
        if (norm === null) {
          el.classList.add("invalid");
        } else {
          el.classList.remove("invalid");
          el.value = norm;
        }
      });
    }
    attachTimeField("start_time");
    attachTimeField("end_time");

    // Weekday multiple-choice. Internally we still use cron day tokens
    // (mon..sun), but the UI is fully localized to German.
    const DAYS = [
      { token: "mon", de: "Mo" },
      { token: "tue", de: "Di" },
      { token: "wed", de: "Mi" },
      { token: "thu", de: "Do" },
      { token: "fri", de: "Fr" },
      { token: "sat", de: "Sa" },
      { token: "sun", de: "So" },
    ];
    const TOKEN_TO_IDX = { mon: 0, tue: 1, wed: 2, thu: 3, fri: 4, sat: 5, sun: 6 };
    const IDX_TO_TOKEN = DAYS.map((d) => d.token);

    function parseFrequency(str) {
      const s = String(str || "*").trim().toLowerCase();
      const idx = new Set();
      if (s === "*" || s === "mon-sun" || s === "all") {
        for (let i = 0; i < 7; i++) idx.add(i);
        return idx;
      }
      for (const part of s.split(",")) {
        const p = part.trim();
        if (p === "") continue;
        if (p.includes("-")) {
          const [a, b] = p.split("-").map((x) => TOKEN_TO_IDX[x.trim()]);
          if (a == null || b == null) continue;
          let i = a;
          while (true) {
            idx.add(i);
            if (i === b) break;
            i = (i + 1) % 7;
            if (i === a) break;
          }
        } else if (TOKEN_TO_IDX[p] != null) {
          idx.add(TOKEN_TO_IDX[p]);
        }
      }
      return idx;
    }

    function buildFrequency(idxSet) {
      if (idxSet.size === 0) return "";
      if (idxSet.size === 7) return "*";
      return [...idxSet]
        .sort((a, b) => a - b)
        .map((i) => IDX_TO_TOKEN[i])
        .join(",");
    }

    function formatFrequency(str) {
      const idx = parseFrequency(str);
      if (idx.size === 0) return "–";
      if (idx.size === 7) return "Täglich";
      return [...idx]
        .sort((a, b) => a - b)
        .map((i) => DAYS[i].de)
        .join(", ");
    }

    function getFrequency() {
      const idx = new Set();
      document.querySelectorAll(".day:checked").forEach((c) => idx.add(TOKEN_TO_IDX[c.value]));
      return buildFrequency(idx);
    }

    function setFrequency(str) {
      const idx = parseFrequency(str);
      document.querySelectorAll(".day").forEach((c) => {
        c.checked = idx.has(TOKEN_TO_IDX[c.value]);
      });
    }

    async function loadStations() {
      const rows = await (await fetch("/api/stations")).json();
      const tb = $("stations").querySelector("tbody");
      tb.innerHTML = "";
      const sel = $("station_id");
      sel.innerHTML = "";
      for (const s of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><a href="javascript:void(0)" class="url-link" data-edit="${s.id}">${s.name}</a></td>
          <td><a href="/api/stations/${s.id}/open" class="url-link" onclick="window.open(this.href,'player','width=600,height=200');return false;">${s.url}</a></td>
          <td><a href="javascript:void(0)" class="del-link" data-del="${s.id}">[X]</a></td>`;
        tb.appendChild(tr);
        const opt = document.createElement("option");
        opt.value = s.id; opt.textContent = s.name;
        sel.appendChild(opt);
      }
      tb.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editStation(b.dataset.edit));
      tb.querySelectorAll("[data-del]").forEach(b => b.onclick = () => delStation(b.dataset.del));
    }

    async function editStation(id) {
      const s = await (await fetch("/api/stations/" + id)).json();
      $("station-id").value = s.id;
      $("station-name").value = s.name;
      $("station-url").value = s.url;
      $("station-submit").textContent = "Aktualisieren";
    }

    function resetStationForm() {
      $("station-form").reset();
      $("station-id").value = "";
      $("station-submit").textContent = "Sender speichern";
    }

    async function delStation(id) {
      if (!confirm("Sender löschen? (Nur möglich, wenn keine Sendung ihn nutzt)")) return;
      const res = await fetch("/api/stations/" + id, { method: "DELETE" });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert("Sender konnte nicht gelöscht werden: " + (err.detail || res.status));
        return;
      }
      loadStations();
    }

    $("station-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = $("station-id").value;
      const payload = { name: $("station-name").value, url: $("station-url").value };
      if (id) {
        await fetch("/api/stations/" + id, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      } else {
        await fetch("/api/stations", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      }
      resetStationForm();
      loadStations();
    };
    $("station-reset").onclick = resetStationForm;

    async function loadSchedules() {
      const rows = await (await fetch("/api/schedules")).json();
      const status = await (await fetch("/api/status")).json();
      const running = new Set(status.jobs.filter(j => j.running).map(j => j.id));
      const tb = $("schedules").querySelector("tbody");
      tb.innerHTML = "";
      for (const r of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><a href="javascript:void(0)" class="url-link" data-edit="${r.id}">${r.title}</a></td>
          <td>${r.station_name}</td>
          <td>${r.start_time}–${r.end_time}</td>
          <td>${formatFrequency(r.frequency)}</td>
          <td>${running.has(r.id) ? '<span class="running">● läuft</span>' : (r.enabled ? "geplant" : "pausiert")}</td>
          <td style="text-align:right">
            <a href="javascript:void(0)" class="url-link" data-toggle="${r.id}">${r.enabled ? "Pausieren" : "Aktivieren"}</a>
            <a href="javascript:void(0)" class="del-link" data-del="${r.id}">[X]</a>
          </td>`;
        tb.appendChild(tr);
      }
      tb.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editSchedule(b.dataset.edit));
      tb.querySelectorAll("[data-del]").forEach(b => b.onclick = () => delSchedule(b.dataset.del));
      tb.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => toggleSchedule(b.dataset.toggle));
    }

    let _expandedFolders = new Set();
    let _lastRecordings = null;
    let _prefsInitialized = false;

    // Persist the open/closed folder state in a cookie so it survives a
    // full page reload (not just the 1s auto-refresh).
    const EXPANDED_COOKIE = "radiotimer_expanded";

    function loadExpandedState() {
      const m = document.cookie.match(
        new RegExp("(?:^|;\\s*)" + EXPANDED_COOKIE + "=([^;]*)")
      );
      if (!m) return;
      try {
        const arr = JSON.parse(decodeURIComponent(m[1]));
        if (Array.isArray(arr)) {
          _expandedFolders = new Set(arr);
          _prefsInitialized = true;
        }
      } catch (e) {
        /* ignore malformed cookie */
      }
    }

    function saveExpandedState() {
      _prefsInitialized = true;
      const value = encodeURIComponent(JSON.stringify([..._expandedFolders]));
      document.cookie =
        EXPANDED_COOKIE + "=" + value + "; path=/; max-age=31536000";
    }

    // Re-read the current open/closed state from the DOM and persist it.
    function syncExpandedFromDom() {
      const open = new Set();
      document
        .querySelectorAll("#recordings details[data-path]")
        .forEach((d) => {
          if (d.open) open.add(d.dataset.path);
        });
      _expandedFolders = open;
      saveExpandedState();
    }

    async function loadRecordings() {
      const data = await (await fetch("/api/recordings")).json();
      const tree = data.tree;
      const json = JSON.stringify(tree);
      // Skip re-rendering when nothing changed, so open folders stay open
      // and there is no flicker on every auto-refresh.
      if (json === _lastRecordings) {
        return;
      }
      const first = _lastRecordings === null;
      _lastRecordings = json;

      // On the first render, keep the state loaded from the cookie.
      // Afterwards, capture the current open/closed state from the DOM.
      if (!first) syncExpandedFromDom();

      const root = $("recordings");
      root.innerHTML = "";
      if (!tree.children.length) {
        root.innerHTML = '<p class="muted">Noch keine Aufnahmen.</p>';
        return;
      }
      for (const child of tree.children) {
        root.appendChild(renderNode(child, [], 0));
      }
      root.querySelectorAll("[data-del]").forEach((b) => {
        b.onclick = (e) => {
          e.preventDefault();
          delRecording(b.dataset.del);
        };
      });
    }

    async function delRecording(path) {
      if (!confirm("Aufnahme löschen?")) return;
      const res = await fetch(
        "/api/recordings?path=" + encodeURIComponent(path),
        { method: "DELETE" }
      );
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert("Konnte Aufnahme nicht löschen: " + (err.detail || res.status));
        return;
      }
      _lastRecordings = null;
      loadRecordings();
    }

    function renderNode(node, pathParts, depth) {
      if (node.type === "file") {
        const row = document.createElement("div");
        row.className = "file-row";
        const size = node.size ? (node.size / 1024 / 1024).toFixed(2) + " MB" : "";
        row.innerHTML = `
          <a href="${node.url}" onclick="window.open(this.href,'player','width=600,height=200');return false;">${node.name}</a>
          <span class="muted">(${size})</span>
          <a href="javascript:void(0)" class="del-link" data-del="${node.path}">[X]</a>`;
        return row;
      }
      const parts = [...pathParts, node.name];
      const path = parts.join("/");
      const details = document.createElement("details");
      details.dataset.path = path;
      // Before the user has expressed any preference (no cookie yet), keep
      // the top-level (sender) folders open; afterwards honour the cookie
      // for every level, including the senders.
      const defaultOpen = !_prefsInitialized && depth < 1;
      details.open = defaultOpen || _expandedFolders.has(path);
      const summary = document.createElement("summary");
      summary.textContent = node.name;
      details.appendChild(summary);
      details.addEventListener("toggle", syncExpandedFromDom);
      for (const child of node.children) {
        details.appendChild(renderNode(child, parts, depth + 1));
      }
      return details;
    }

    async function editSchedule(id) {
      const r = await (await fetch("/api/schedules/" + id)).json();
      $("id").value = r.id;
      $("title").value = r.title;
      $("station_id").value = r.station_id;
      $("start_time").value = r.start_time;
      $("end_time").value = r.end_time;
      setFrequency(r.frequency);
      $("enabled").checked = r.enabled;
      $("start_time").classList.remove("invalid");
      $("end_time").classList.remove("invalid");
      $("submit-btn").textContent = "Aktualisieren";
    }

    function resetScheduleForm() {
      $("schedule-form").reset();
      $("id").value = "";
      $("start_time").classList.remove("invalid");
      $("end_time").classList.remove("invalid");
      setFrequency("*");
      $("enabled").checked = true;
      $("submit-btn").textContent = "Speichern";
    }

    async function delSchedule(id) {
      if (!confirm("Sendung löschen?")) return;
      await fetch("/api/schedules/" + id, { method: "DELETE" });
      loadSchedules();
    }

    async function toggleSchedule(id) {
      const cur = await (await fetch("/api/schedules/" + id)).json();
      const willEnable = !cur.enabled;
      cur.enabled = willEnable;
      const res = await fetch("/api/schedules/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cur),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert("Konnte Status nicht ändern: " + (err.detail || res.status));
        return;
      }
      // Disabling a schedule also stops a recording that is currently in
      // progress (handled server-side), so "pausiert" really means no
      // recording happens. Re-enabling a schedule that is within its window
      // starts recording again automatically.
      loadSchedules();
    }

    $("schedule-form").onsubmit = async (e) => {
      e.preventDefault();
      const startNorm = normalizeTime($("start_time").value);
      const endNorm = normalizeTime($("end_time").value);
      if (startNorm === null) {
        $("start_time").classList.add("invalid");
        alert("Ungültige Startzeit. Bitte im Format HH:MM eingeben (z. B. 20:00).");
        return;
      }
      if (endNorm === null) {
        $("end_time").classList.add("invalid");
        alert("Ungültige Endzeit. Bitte im Format HH:MM eingeben (z. B. 21:00).");
        return;
      }
      const freq = getFrequency();
      if (freq === "") {
        alert("Bitte mindestens einen Wochentag auswählen.");
        return;
      }
      const id = $("id").value;
      const payload = {
        title: $("title").value,
        station_id: $("station_id").value,
        start_time: startNorm,
        end_time: endNorm,
        frequency: freq,
        audio_format: "mp3",
        enabled: $("enabled").checked,
      };
      if (id) {
        await fetch("/api/schedules/" + id, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      } else {
        await fetch("/api/schedules", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      }
      resetScheduleForm();
      loadSchedules();
    };

    $("reset-btn").onclick = resetScheduleForm;

    loadStations();
    loadSchedules();
    loadExpandedState();
    loadRecordings();
    // Recordings and schedule status refresh every second (live view).
    setInterval(loadRecordings, 1000);
    setInterval(loadSchedules, 1000);
  </script>
</body>
</html>
