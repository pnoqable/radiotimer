<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>radiotimer</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 1300px; }
    h1 { margin-bottom: .25rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #8884; vertical-align: top; }
    form { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; margin-top: 1rem; }
    form label { display: flex; flex-direction: column; font-size: .8rem; }
    input, select { padding: .35rem; }
    input.invalid { border: 1px solid #c33; background: #fff0f0; }
    .days { grid-column: 1 / -1; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; border: 1px solid #8884; border-radius: 6px; padding: .5rem .75rem; margin: 0; }
    .days legend { font-size: .8rem; padding: 0 .25rem; }
    .days label { flex-direction: row; font-size: .8rem; gap: .25rem; }
    button { padding: .4rem .8rem; cursor: pointer; }
    .running { color: #2a2; font-weight: bold; }
    .card { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 0; }
    .col-left > .card:not(:first-child) { margin-top: 1rem; }
    .layout { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1rem; }
    @media (min-width: 1280px) {
      .layout { grid-template-columns: 1.6fr 1fr; align-items: start; }
    }
    details { margin-left: 1rem; }
    summary { cursor: pointer; font-weight: 600; }
    /* Collapsible top-level sections (replaces the bulky h1/h2 headers). */
    details.section { margin-left: 0; border: 1px solid #8884; border-radius: 8px; padding: 1rem; }
    .col-left > .section:not(:first-child) { margin-top: 1rem; }
    details.section > summary.section-title {
      font-size: 1.3rem; font-weight: 600; cursor: pointer;
      margin: 0 0 .5rem; list-style: none;
    }
    details.section > summary.section-title::-webkit-details-marker { display: none; }
    /* Green dot indicating a recording that is currently running. */
    .file-row { display: flex; gap: .5rem; align-items: center; padding: .15rem 0 0 1.5rem; }
    .del-link { color: #c33; text-decoration: none; cursor: pointer; }
    .url-link { color: inherit; text-decoration: underline; cursor: pointer; }
    .url-link.running { color: #2a2; }
    .del-link:hover { text-decoration: underline; }
    .muted { color: #888; }
    /* Inline SVG icon set (sprite via <symbol> + <use>, currentColor). */
    .icon { width: 1.1em; height: 1.1em; vertical-align: -0.15em; fill: none;
            stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            flex: none; }
    .icon-btn { display: inline-flex; align-items: center; gap: .25rem;
                text-decoration: none; }
    a.icon-btn + a.icon-btn,
    a.icon-btn + svg.icon-live,
    svg.icon-live + a.icon-btn { margin-left: .45rem; }
    summary .podcast-link { margin-left: .45rem; vertical-align: middle; }
    .icon-live { fill: currentColor; stroke: none; color: #2a2;
                 animation: live-pulse 1.4s ease-in-out infinite; }
    @keyframes live-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: .55; }
    }
    .app-header { display: flex; align-items: center; gap: .5rem; margin: 0 0 1rem; }
    .app-header h1 { font-size: 1.4rem; margin: 0; }
    .app-logo { width: 1.9rem; height: 1.9rem; color: #b5651d; }
    .disk-usage { margin-top: .75rem; padding-top: .6rem; font-size: .82rem; }
    .disk-bar { height: 6px; background: #8884; border-radius: 3px; overflow: hidden; margin-bottom: .35rem; }
    .disk-bar-fill { height: 100%; background: #888; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="icon-live" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5.5"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M3 6h18"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <path d="M10 11v6"/>
      <path d="M14 11v6"/>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
      <path d="M15 5l4 4"/>
    </symbol>
    <symbol id="icon-player" viewBox="0 0 24 24">
      <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
      <path fill="currentColor" stroke="none" d="M10 9.5l4 2.5-4 2.5z"/>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <path d="M8 2v4"/>
      <path d="M16 2v4"/>
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <path d="M3 10h18"/>
    </symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24">
      <rect x="6" y="5" width="4" height="14" rx="1"/>
      <rect x="14" y="5" width="4" height="14" rx="1"/>
    </symbol>
    <symbol id="icon-rss" viewBox="0 0 24 24">
      <circle cx="5" cy="17.5" r="2.5"/>
      <path d="M5 5a11 11 0 0 1 11 11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M5 10.5a6.5 6.5 0 0 1 6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </svg>
  <div class="layout">
    <div class="col-left">
      <details class="section" open id="sec-stations">
        <summary class="section-title">Sender</summary>
        <table id="stations">
          <thead><tr><th>Name</th><th>URL</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <form id="station-form">
          <input type="hidden" id="station-id" />
          <label>Name<input id="station-name" required /></label>
          <label>Stream/Playlist-URL<input id="station-url" required /></label>
          <button type="submit" id="station-submit">Sender neu anlegen</button>
          <button type="button" id="station-reset">Abbrechen</button>
        </form>
      </details>

      <details class="section" open id="sec-schedules">
        <summary class="section-title">Sendungen</summary>
        <table id="schedules">
          <thead><tr><th>Titel</th><th>Sender</th><th>Zeit</th><th>Wochentage</th><th>Status</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <form id="schedule-form">
          <input type="hidden" id="id" />
          <label>Titel<input id="title" required /></label>
          <label>Sender<select id="station_id" required></select></label>
          <label>Start (HH:MM)<input id="start_time" required /></label>
          <label>Ende (HH:MM)<input id="end_time" required /></label>
          <fieldset class="days">
            <legend>Wochentage</legend>
            <label><input type="checkbox" class="day" value="mon" />Montags</label>
            <label><input type="checkbox" class="day" value="tue" />Dienstags</label>
            <label><input type="checkbox" class="day" value="wed" />Mittwochs</label>
            <label><input type="checkbox" class="day" value="thu" />Donnerstags</label>
            <label><input type="checkbox" class="day" value="fri" />Freitags</label>
            <label><input type="checkbox" class="day" value="sat" />Samstags</label>
            <label><input type="checkbox" class="day" value="sun" />Sonntags</label>
          </fieldset>
          <button type="submit" id="submit-btn">Sendung neu anlegen</button>
          <button type="button" id="reset-btn">Abbrechen</button>
        </form>
      </details>
    </div>

    <div class="col-right">
      <details class="section" open id="sec-recordings">
        <summary class="section-title">Aufnahmen</summary>
        <div id="recordings"></div>
        <div id="disk-usage" class="disk-usage"></div>
      </details>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function icon(name) {
      return `<svg class="icon" aria-hidden="true"><use href="#icon-${name}"/></svg>`;
    }
    function liveIcon() {
      return `<svg class="icon icon-live" aria-hidden="true"><use href="#icon-live"/></svg>`;
    }
    function fmtBytes(n) {
      if (n === undefined || n === null) return "—";
      if (n < 1024) return n + " B";
      const units = ["KB", "MB", "GB", "TB", "PB"];
      let i = -1, v = n;
      do { v /= 1024; i++; } while (v >= 1024 && i < units.length - 1);
      return v.toFixed(v >= 10 || i === 0 ? 0 : 1) + " " + units[i];
    }
    async function loadDisk() {
      try {
        const d = await (await fetch("/api/disk")).json();
        const pct = d.total ? (d.used / d.total) * 100 : 0;
        $("disk-usage").innerHTML = `
          <div class="disk-bar"><div class="disk-bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
          <div class="muted">${fmtBytes(d.used)} belegt · ${fmtBytes(d.free)} frei (${pct.toFixed(0)}% von ${fmtBytes(d.total)})</div>`;
      } catch (_) {}
    }

    // Normalize a free-form time entry to "HH:MM". Accepts "16", "16:00",
    // "1600", "8:5", etc. Returns null for anything that is not a valid time.
    function normalizeTime(raw) {
      if (raw == null) return null;
      const s = String(raw).trim().replace(/\s+/g, "");
      if (s === "") return null;
      let h, m = 0;
      if (s.includes(":")) {
        const parts = s.split(":");
        if (parts.length !== 2) return null;
        h = parts[0];
        m = parts[1];
      } else if (/^\d{3,4}$/.test(s)) {
        h = s.slice(0, s.length - 2);
        m = s.slice(s.length - 2);
      } else if (/^\d{1,2}$/.test(s)) {
        h = s;
      } else {
        return null;
      }
      if (!/^\d{1,2}$/.test(h) || !/^\d{1,2}$/.test(m)) return null;
      h = parseInt(h, 10);
      m = parseInt(m, 10);
      if (h < 0 || h > 23 || m < 0 || m > 59) return null;
      return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
    }

    function attachTimeField(id) {
      const el = $(id);
      el.addEventListener("blur", () => {
        if (el.value.trim() === "") {
          el.classList.remove("invalid");
          return;
        }
        const norm = normalizeTime(el.value);
        if (norm === null) {
          el.classList.add("invalid");
        } else {
          el.classList.remove("invalid");
          el.value = norm;
        }
      });
    }
    attachTimeField("start_time");
    attachTimeField("end_time");

    // Weekday multiple-choice. Internally we still use cron day tokens
    // (mon..sun), but the UI is fully localized to German.
    const DAYS = [
      { token: "mon", de: "Mo", adv: "Montags" },
      { token: "tue", de: "Di", adv: "Dienstags" },
      { token: "wed", de: "Mi", adv: "Mittwochs" },
      { token: "thu", de: "Do", adv: "Donnerstags" },
      { token: "fri", de: "Fr", adv: "Freitags" },
      { token: "sat", de: "Sa", adv: "Samstags" },
      { token: "sun", de: "So", adv: "Sonntags" },
    ];
    const TOKEN_TO_IDX = { mon: 0, tue: 1, wed: 2, thu: 3, fri: 4, sat: 5, sun: 6 };
    const IDX_TO_TOKEN = DAYS.map((d) => d.token);

    function parseFrequency(str) {
      const s = String(str || "*").trim().toLowerCase();
      const idx = new Set();
      if (s === "*" || s === "mon-sun" || s === "all") {
        for (let i = 0; i < 7; i++) idx.add(i);
        return idx;
      }
      for (const part of s.split(",")) {
        const p = part.trim();
        if (p === "") continue;
        if (p.includes("-")) {
          const [a, b] = p.split("-").map((x) => TOKEN_TO_IDX[x.trim()]);
          if (a == null || b == null) continue;
          let i = a;
          while (true) {
            idx.add(i);
            if (i === b) break;
            i = (i + 1) % 7;
            if (i === a) break;
          }
        } else if (TOKEN_TO_IDX[p] != null) {
          idx.add(TOKEN_TO_IDX[p]);
        }
      }
      return idx;
    }

    function buildFrequency(idxSet) {
      if (idxSet.size === 0) return "";
      if (idxSet.size === 7) return "*";
      return [...idxSet]
        .sort((a, b) => a - b)
        .map((i) => IDX_TO_TOKEN[i])
        .join(",");
    }

    function formatFrequency(str) {
      const idx = parseFrequency(str);
      if (idx.size === 0) return "–";
      if (idx.size === 7) return "Täglich";
      if (idx.size === 1) return DAYS[[...idx][0]].adv;
      return [...idx]
        .sort((a, b) => a - b)
        .map((i) => DAYS[i].de)
        .join(", ");
    }

    function getFrequency() {
      const idx = new Set();
      document.querySelectorAll(".day:checked").forEach((c) => idx.add(TOKEN_TO_IDX[c.value]));
      return buildFrequency(idx);
    }

    function setFrequency(str) {
      const idx = parseFrequency(str);
      document.querySelectorAll(".day").forEach((c) => {
        c.checked = idx.has(TOKEN_TO_IDX[c.value]);
      });
    }

    async function loadStations() {
      // Preserve the currently selected station across the rebuild, otherwise
      // the SSE-driven refresh resets the combo to the placeholder (e.g. right
      // after saving an edited schedule).
      const sel = $("station_id");
      const prevSelected = sel ? sel.value : "";
      const rows = await (await fetch("/api/stations")).json();
      const tb = $("stations").querySelector("tbody");
      tb.innerHTML = "";
      sel.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "– bitte Sender wählen –";
      placeholder.selected = true;
      sel.appendChild(placeholder);
      for (const s of rows) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${s.name}</td>
          <td><a href="/api/stations/${s.id}/open" class="url-link icon-btn" onclick="window.open(this.href,'player','width=600,height=200');return false;" title="Stream öffnen">${icon('player')} ${s.url}</a></td>
          <td><a href="javascript:void(0)" class="url-link icon-btn" data-edit="${s.id}" title="Bearbeiten">${icon('edit')}</a><a href="javascript:void(0)" class="del-link icon-btn" data-del="${s.id}" title="Löschen">${icon('trash')}</a></td>`;
        tb.appendChild(tr);
        const opt = document.createElement("option");
        opt.value = s.id; opt.textContent = s.name;
        sel.appendChild(opt);
      }
      if (prevSelected) sel.value = prevSelected;
      tb.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editStation(b.dataset.edit));
      tb.querySelectorAll("[data-del]").forEach(b => b.onclick = () => delStation(b.dataset.del));
    }

    async function editStation(id) {
      const s = await (await fetch("/api/stations/" + id)).json();
      $("station-id").value = s.id;
      $("station-name").value = s.name;
      $("station-url").value = s.url;
      $("station-submit").textContent = "Änderungen speichern";
    }

    function resetStationForm() {
      $("station-form").reset();
      $("station-id").value = "";
      $("station-submit").textContent = "Sender neu anlegen";
    }

    async function delStation(id) {
      if (!confirm("Sender löschen? (Nur möglich, wenn keine Sendung ihn nutzt)")) return;
      const res = await fetch("/api/stations/" + id, { method: "DELETE" });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert("Sender konnte nicht gelöscht werden: " + (err.detail || res.status));
        return;
      }
    }

    $("station-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = $("station-id").value;
      const payload = { name: $("station-name").value, url: $("station-url").value };
      if (id) {
        await fetch("/api/stations/" + id, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      } else {
        const res = await fetch("/api/stations", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
        if (res.ok) {
          const created = await res.json();
          $("station-id").value = created.id;
          $("station-submit").textContent = "Änderungen speichern";
        }
      }
    };
    $("station-reset").onclick = resetStationForm;

    async function loadSchedules() {
      const rows = await (await fetch("/api/schedules")).json();
      const status = await (await fetch("/api/status")).json();
      const running = new Set(status.jobs.filter(j => j.running).map(j => j.id));
      const liveUrls = new Map(status.jobs.filter(j => j.live_url).map(j => [j.id, j.live_url]));
      const tb = $("schedules").querySelector("tbody");
      tb.innerHTML = "";
      for (const r of rows) {
        const tr = document.createElement("tr");
        const statusCell = running.has(r.id)
          ? `<a href="javascript:void(0)" class="url-link icon-btn" data-toggle="${r.id}" data-running="1">${liveIcon()} läuft</a>`
          : `<a href="javascript:void(0)" class="url-link icon-btn" data-toggle="${r.id}">${r.enabled ? icon('calendar') + ' geplant' : icon('pause') + ' pausiert'}</a>`;

        let actionCell;
        if (running.has(r.id)) {
          // Play button moves to the end of the row. When the live URL is not
          // available yet, show a disabled (greyed) play icon without a link.
          actionCell = liveUrls.has(r.id)
            ? `<a href="${liveUrls.get(r.id)}" class="url-link icon-btn" onclick="window.open(this.href,'player','width=600,height=200');return false;" title="Live abspielen">${icon('player')}</a>`
            : `<span class="icon-btn muted" title="Live-Wiedergabe noch nicht verfügbar">${icon('player')}</span>`;
        } else {
          actionCell = `<a href="javascript:void(0)" class="del-link icon-btn" data-del="${r.id}" title="Löschen">${icon('trash')}</a>`;
        }

        tr.innerHTML = `
          <td>${r.title}</td>
          <td>${r.station_name}</td>
          <td>${r.start_time}–${r.end_time}</td>
          <td>${formatFrequency(r.frequency)}</td>
          <td>${statusCell}</td>
          <td><a href="javascript:void(0)" class="url-link icon-btn" data-edit="${r.id}" title="Bearbeiten">${icon('edit')}</a>${actionCell}</td>`;
        tb.appendChild(tr);
      }
      tb.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editSchedule(b.dataset.edit));
      tb.querySelectorAll("[data-del]").forEach(b => b.onclick = () => delSchedule(b.dataset.del));
      tb.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => toggleSchedule(b.dataset.toggle, b.dataset.running === "1"));
    }

    let _collapsedFolders = new Set();
    let _collapsedSections = new Set();
    let _lastRecordings = null;
    let _buildingFolders = false;

    // Persist the open/closed state (collapsed folders + collapsed top-level
    // sections) in a cookie so it survives a full page reload (not just the
    // 1s auto-refresh). We store what is COLLAPSED: entries not listed here
    // default to open, so newly appearing folders stay visible.
    const UI_COOKIE = "radiotimer_ui";

    function loadUiState() {
      const m = document.cookie.match(
        new RegExp("(?:^|;\\s*)" + UI_COOKIE + "=([^;]*)")
      );
      if (!m) return;
      try {
        const data = JSON.parse(decodeURIComponent(m[1]));
        if (Array.isArray(data.folders))
          _collapsedFolders = new Set(data.folders);
        if (Array.isArray(data.sections))
          _collapsedSections = new Set(data.sections);
      } catch (e) {
        /* ignore malformed cookie */
      }
    }

    function saveUiState() {
      const value = encodeURIComponent(
        JSON.stringify({
          folders: [..._collapsedFolders],
          sections: [..._collapsedSections],
        })
      );
      document.cookie = UI_COOKIE + "=" + value + "; path=/; max-age=31536000";
    }

    // Re-read the current open/closed folder state from the DOM and persist it.
    // Fired only when the user actually toggles a folder or after a refresh in
    // which the tree changed. It must NOT touch the section collapse set, so a
    // section toggle (which also fires a "toggle" event) cannot clobber the
    // folder state before the recordings folder tree has been rendered.
    function syncCollapsedFromDom() {
      // While the folder tree is being (re)built, the freshly created <details>
      // elements fire "toggle" events on insertion before the whole tree is in
      // the document, which would capture only a partial view. Ignore those;
      // the loadRecordings() code below persists the full state afterwards.
      if (_buildingFolders) return;
      _collapsedFolders = new Set();
      document
        .querySelectorAll("#recordings details[data-path]")
        .forEach((d) => {
          if (!d.open) _collapsedFolders.add(d.dataset.path);
        });
      saveUiState();
    }

    // Re-read the open/closed section state and persist it. Separate from the
    // folder sync so the two never overwrite each other's persisted state.
    function syncSectionsFromDom() {
      _collapsedSections = new Set();
      document.querySelectorAll("details.section").forEach((d) => {
        if (!d.open && d.id) _collapsedSections.add(d.id);
      });
      saveUiState();
    }

    // Apply the persisted collapse state to the top-level sections (Sender,
    // Sendungen, Aufnahmen) and keep it up to date on every toggle.
    function applySectionStates() {
      document.querySelectorAll("details.section").forEach((d) => {
        if (!d.id) return;
        d.open = !_collapsedSections.has(d.id);
        d.addEventListener("toggle", syncSectionsFromDom);
      });
    }

    async function loadRecordings() {
      const data = await (await fetch("/api/recordings")).json();
      const tree = data.tree;
      const json = JSON.stringify(tree);
      // Skip re-rendering when nothing changed, so open folders stay open
      // and there is no flicker on every auto-refresh.
      if (json === _lastRecordings) {
        return;
      }
      const first = _lastRecordings === null;
      _lastRecordings = json;

      // On the first render, keep the state loaded from the cookie.
      // Afterwards, capture the current open/closed state from the DOM.
      if (!first) syncCollapsedFromDom();

      const root = $("recordings");
      _buildingFolders = true;
      try {
        root.innerHTML = "";
      } finally {
        _buildingFolders = false;
      }
      if (!tree.children.length) {
        root.innerHTML = '<p class="muted">Noch keine Aufnahmen.</p>';
        return;
      }
      _buildingFolders = true;
      try {
        for (const child of tree.children) {
          root.appendChild(renderNode(child, [], 0));
        }
      } finally {
        _buildingFolders = false;
      }
      // Inserting the freshly built <details> elements fires "toggle" events
      // (ignored while _buildingFolders was set above). Persist the real state
      // of the complete tree now so the cookie matches what is on screen.
      syncCollapsedFromDom();
      root.querySelectorAll("[data-del]").forEach((b) => {
        b.onclick = (e) => {
          e.preventDefault();
          delRecording(b.dataset.del);
        };
      });
    }

    async function delRecording(path) {
      if (!confirm("Aufnahme löschen?")) return;
      const res = await fetch(
        "/api/recordings?path=" + encodeURIComponent(path),
        { method: "DELETE" }
      );
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert("Konnte Aufnahme nicht löschen: " + (err.detail || res.status));
        return;
      }
    }

    function renderNode(node, pathParts, depth) {
      if (node.type === "file") {
        const row = document.createElement("div");
        row.className = "file-row";
        row.dataset.path = node.path;
        const size = node.size ? (node.size / 1024 / 1024).toFixed(2) + " MB" : "";
        row.innerHTML = `
          <a href="${node.url}" class="url-link icon-btn" onclick="window.open(this.href,'player','width=600,height=200');return false;">${icon('player')} ${node.name}</a>
          <span class="muted">(<span class="size">${size}</span>)</span>
          ${node.live ? liveIcon() : `<a href="javascript:void(0)" class="del-link icon-btn" data-del="${node.path}" title="Löschen">${icon('trash')}</a>`}
          `;
        return row;
      }
      const parts = [...pathParts, node.name];
      const path = parts.join("/");
      const details = document.createElement("details");
      details.dataset.path = path;
      // Folders are open unless the user explicitly collapsed them, so folders
      // that appear later (new recordings) are visible by default.
      details.open = !_collapsedFolders.has(path);
      const summary = document.createElement("summary");
      summary.textContent = node.name;
      const feed = document.createElement("a");
      feed.href = "/api/podcast?folder=" + encodeURIComponent(path);
      feed.className = "url-link icon-btn podcast-link";
      feed.title = "Podcast-Feed";
      feed.target = "_blank";
      feed.innerHTML = icon('rss');
      feed.addEventListener("click", (e) => e.stopPropagation());
      summary.appendChild(feed);
      details.appendChild(summary);
      details.addEventListener("toggle", syncCollapsedFromDom);
      for (const child of node.children) {
        details.appendChild(renderNode(child, parts, depth + 1));
      }
      return details;
    }

    async function editSchedule(id) {
      const r = await (await fetch("/api/schedules/" + id)).json();
      $("id").value = r.id;
      $("title").value = r.title;
      $("station_id").value = r.station_id;
      $("start_time").value = r.start_time;
      $("end_time").value = r.end_time;
      setFrequency(r.frequency);
      $("start_time").classList.remove("invalid");
      $("end_time").classList.remove("invalid");
      $("submit-btn").textContent = "Änderungen speichern";
    }

    function resetScheduleForm() {
      $("schedule-form").reset();
      $("station_id").selectedIndex = 0;
      $("id").value = "";
      $("start_time").classList.remove("invalid");
      $("end_time").classList.remove("invalid");
      document.querySelectorAll(".day").forEach((c) => { c.checked = false; });
      $("submit-btn").textContent = "Sendung neu anlegen";
    }

    async function delSchedule(id) {
      if (!confirm("Sendung löschen?")) return;
      await fetch("/api/schedules/" + id, { method: "DELETE" });
    }

    async function toggleSchedule(id, running) {
      const cur = await (await fetch("/api/schedules/" + id)).json();
      const willEnable = !cur.enabled;
      // Pausing a schedule that is currently recording would stop the running
      // capture, so ask for confirmation before doing so.
      if (running && !willEnable) {
        if (!confirm("Aufnahme läuft gerade. Wirklich pausieren?")) return;
      }
      cur.enabled = willEnable;
      const res = await fetch("/api/schedules/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cur),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert("Konnte Status nicht ändern: " + (err.detail || res.status));
        return;
      }
      // Disabling a schedule also stops a recording that is currently in
      // progress (handled server-side), so "deaktiviert" really means no
      // recording happens. Re-enabling a schedule that is within its window
      // starts recording again automatically.
    }

    $("schedule-form").onsubmit = async (e) => {
      e.preventDefault();
      const startNorm = normalizeTime($("start_time").value);
      const endNorm = normalizeTime($("end_time").value);
      if (startNorm === null) {
        $("start_time").classList.add("invalid");
        alert("Ungültige Startzeit. Bitte im Format HH:MM eingeben (z. B. 20:00).");
        return;
      }
      if (endNorm === null) {
        $("end_time").classList.add("invalid");
        alert("Ungültige Endzeit. Bitte im Format HH:MM eingeben (z. B. 21:00).");
        return;
      }
      const freq = getFrequency();
      if (freq === "") {
        alert("Bitte mindestens einen Wochentag auswählen.");
        return;
      }
      const id = $("id").value;
      const payload = {
        title: $("title").value,
        station_id: $("station_id").value,
        start_time: startNorm,
        end_time: endNorm,
        frequency: freq,
        audio_format: "mp3",
      };
      if (id) {
        await fetch("/api/schedules/" + id, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      } else {
        const res = await fetch("/api/schedules", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
        if (res.ok) {
          const created = await res.json();
          $("id").value = created.id;
          $("submit-btn").textContent = "Änderungen speichern";
        }
      }
    };

    $("reset-btn").onclick = resetScheduleForm;

    resetStationForm();
    resetScheduleForm();

    loadUiState();
    applySectionStates();

    let lastEvent = Date.now();
    function silentRefresh() {
      loadStations();
      loadSchedules();
      loadRecordings();
      loadDisk();
      lastEvent = Date.now();
    }
    function createEventSource() {
      const eventSource = new EventSource("/api/events");
      eventSource.onopen = silentRefresh
      eventSource.addEventListener("state", silentRefresh);
      eventSource.addEventListener("progress", (e) => {
        try {
          const d = JSON.parse(e.data);
          const mb = (d.size / 1024 / 1024).toFixed(2) + " MB";
          let found = false;
          for (const r of document.querySelectorAll("#recordings [data-path]")) {
            if (r.dataset.path === d.path) {
              const span = r.querySelector(".size");
              if (span) span.textContent = mb;
              found = true;
              break;
            }
          }
          if (!found) loadRecordings();
          else lastEvent = Date.now();
        } catch (_) {}
      });
      eventSource.addEventListener("ping", (e) => {
        lastEvent = Date.now();
      });
      return eventSource;
    }
    let events = createEventSource();
    setInterval(() => {
      if (Date.now() - lastEvent > 10000) {
        events.close();
        events = createEventSource();
      }
    }, 1000);
  </script>
</body>
</html>
