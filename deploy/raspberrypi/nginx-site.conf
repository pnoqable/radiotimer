# RadioTimer nginx reverse proxy (native Raspberry Pi deployment).
# Serves the web UI / API on port 80 while the service keeps listening on 8000.
#
# Enable:
#   sudo ln -s /etc/nginx/sites-available/radiotimer /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# For absolute enclosure URLs in podcast feeds, set RADIOTIMER_PUBLIC_URL
# (in deploy/raspberrypi/.env) to the host clients use, e.g.
#   RADIOTIMER_PUBLIC_URL=http://radiotimer.local

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't buffer the live/timeshift stream so listeners catch up to "now".
        proxy_buffering off;
        proxy_request_buffering off;
        # Keep the Server-Sent-Events (/api/events) connection open: no
        # buffering and a long read timeout so the 25s ping keeps it alive.
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
